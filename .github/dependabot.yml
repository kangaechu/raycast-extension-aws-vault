version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pinned to the exact peerDependencies of @raycast/api; update together with it
      - dependency-name: "@types/node"
      - dependency-name: "@types/react"
      - dependency-name: react-devtools
      # @raycast/eslint-config supports typescript <6.1.0
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
